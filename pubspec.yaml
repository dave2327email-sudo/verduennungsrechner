name: Verduennungsrechner
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/bg_paper.jpg
    - assets/images/tube.jpg
    - assets/images/drop.jpg
    - assets/images/flask.jpg
    - assets/images/plus.jpg
    - assets/images/equal.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FAF6EE"
  adaptive_icon_foreground: "assets/images/app_icon.png"
